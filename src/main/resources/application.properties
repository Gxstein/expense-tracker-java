spring.application.name=expense-tracker-api

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME:expense_tracker}
spring.datasource.password=${DB_PASSWORD:expense_tracker}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.issuer=expense-tracker-api
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-production-2026}
app.jwt.expiration=${JWT_EXPIRATION:PT2H}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
